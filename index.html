<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Entry Portal</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: linear-gradient(135deg, #eef3f9 0%, #dce6f2 100%);
  color: #1e293b;
  padding: 16px;
  margin: 0;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 460px;
  margin: 12px auto 32px;
  padding: 26px 24px;
  background: #ffffff;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  border: 1px solid rgba(226, 232, 240, 0.8);
}

.logo-wrapper {
  text-align: center;
  margin-bottom: 12px;
}

.logo-img {
  max-width: 180px;
  max-height: 85px;
  object-fit: contain;
}

h2 {
  text-align: center;
  color: #0f4c81;
  font-size: 22px;
  font-weight: 700;
  margin: 4px 0 6px;
  letter-spacing: -0.3px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  font-size: 13.5px;
  margin: 0 0 22px;
}

/* Floating Top-Left Label Fields */
.field-group {
  position: relative;
  margin-bottom: 16px;
}

.field-group input {
  width: 100%;
  padding: 16px 14px 12px;
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  font-size: 15.5px;
  color: #0f172a;
  background: #ffffff;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.field-group input:focus {
  border-color: #1769aa;
  box-shadow: 0 0 0 3.5px rgba(23, 105, 170, 0.14);
}

.field-group label {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: #ffffff;
  padding: 0 6px;
  color: #64748b;
  font-size: 15px;
  pointer-events: none;
  transition: all 0.18s ease;
  border-radius: 4px;
}

/* Move label to top-left border when focused or filled */
.field-group input:focus + label,
.field-group input:not(:placeholder-shown) + label {
  top: 0;
  transform: translateY(-50%);
  font-size: 12px;
  font-weight: 600;
  color: #1769aa;
}

.field-group input:not(:focus):not(:placeholder-shown) + label {
  color: #475569;
}

/* Selfie Section Card */
.selfie-section {
  background: #f8fafc;
  border: 1.5px dashed #cbd5e1;
  border-radius: 12px;
  padding: 16px;
  margin-top: 20px;
  text-align: center;
}

.selfie-section h3 {
  color: #334155;
  font-size: 14.5px;
  font-weight: 600;
  margin: 0 0 10px;
}

video, canvas, img#preview {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
  background: #0f172a;
}

video {
  display: none;
}

#preview {
  display: none;
  border: 2px solid #1769aa;
}

.btn-row {
  display: flex;
  gap: 10px;
}

button {
  width: 100%;
  padding: 13px 16px;
  border: 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}

button:active:not(:disabled) {
  transform: scale(0.985);
}

.btn-secondary {
  background: #e2e8f0;
  color: #1e293b;
}

.btn-secondary:hover:not(:disabled) {
  background: #cbd5e1;
}

.btn-outline {
  background: #ffffff;
  color: #1769aa;
  border: 1.5px solid #1769aa;
}

.btn-outline:hover:not(:disabled) {
  background: #f0f7ff;
}

button:disabled {
  background: #e2e8f0;
  color: #94a3b8;
  border-color: transparent;
  cursor: not-allowed;
}

#photoStatus {
  font-size: 12.5px;
  color: #64748b;
  margin: 8px 0 0;
}

/* Sticky Submit Button */
#submitBtn {
  position: sticky;
  bottom: 14px;
  z-index: 10;
  background: linear-gradient(135deg, #1769aa 0%, #0f4c81 100%);
  color: #ffffff;
  font-size: 16px;
  padding: 15px;
  margin-top: 22px;
  box-shadow: 0 6px 20px rgba(23, 105, 170, 0.3);
}

#submitBtn:hover:not(:disabled) {
  box-shadow: 0 8px 24px rgba(23, 105, 170, 0.4);
}

#status {
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
  color: #1769aa;
  margin-top: 12px;
  min-height: 18px;
}

.hidden {
  display: none !important;
}

/* Pass code display styling */
.success-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 12px;
  background: #dcfce7;
  color: #16a34a;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

.pass-box {
  background: linear-gradient(180deg, #f0f7ff 0%, #e0effe 100%);
  border: 2px dashed #1769aa;
  border-radius: 14px;
  padding: 22px 16px;
  text-align: center;
  margin: 20px 0;
}

.pass-code {
  font-size: 34px;
  font-weight: 800;
  color: #0f4c81;
  letter-spacing: 3px;
  margin: 10px 0;
}

.btn-success {
  background: #16a34a;
  color: #ffffff;
  margin-top: 8px;
  box-shadow: 0 4px 14px rgba(22, 163, 74, 0.25);
}

.btn-success:hover {
  background: #15803d;
}
</style>
</head>

<body>
<div class="container">

  <!-- Logo -->
  <div class="logo-wrapper">
    <img src="logo.png" alt="Company Logo" class="logo-img">
  </div>

  <!-- SINGLE-PAGE VISITOR ENTRY FORM -->
  <div id="formScreen">
    <h2>Visitor Entry Pass</h2>
    <p class="subtitle">Please fill in your details to generate today's entry pass</p>

    <form id="visitorForm">

      <div class="field-group">
        <input id="name" type="text" placeholder=" " required>
        <label for="name">Visitor Name *</label>
      </div>

      <div class="field-group">
        <input id="mobile" type="tel" placeholder=" " pattern="[0-9]{10}" maxlength="10" title="Please enter a valid 10-digit mobile number" required>
        <label for="mobile">Mobile Number (10 Digits) *</label>
      </div>

      <div class="field-group">
        <input id="company" type="text" placeholder=" " required>
        <label for="company">Company Name *</label>
      </div>

      <div class="field-group">
        <input id="person" type="text" placeholder=" " required>
        <label for="person">Person to Meet *</label>
      </div>

      <div class="field-group">
        <input id="department" type="text" placeholder=" ">
        <label for="department">Department (Optional)</label>
      </div>

      <div class="field-group">
        <input id="purpose" type="text" placeholder=" " required>
        <label for="purpose">Purpose of Visit / Agenda *</label>
      </div>

      <div class="field-group">
        <input id="vehicle" type="text" placeholder=" " style="text-transform: uppercase;">
        <label for="vehicle">Vehicle Number (e.g. GJ01AB1234)</label>
      </div>

      <div class="selfie-section">
        <h3>Visitor Selfie (Optional)</h3>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none"></canvas>
        <img id="preview" alt="Selfie preview">

        <div class="btn-row">
          <button type="button" id="openBtn" class="btn-outline" onclick="openCamera()">
            Open Camera
          </button>

          <button type="button" id="captureBtn" class="btn-secondary" onclick="capturePhoto()" disabled>
            Capture Selfie
          </button>
        </div>

        <button type="button" id="retakeBtn" class="btn-outline" onclick="retakePhoto()" style="display:none; margin-top: 8px;">
          Retake Selfie
        </button>

        <p id="photoStatus">Selfie not captured (Optional)</p>
      </div>

      <!-- Sticky Submit Button -->
      <button type="submit" id="submitBtn">
        Submit Visitor Entry
      </button>

    </form>

    <p id="status"></p>
  </div>

  <!-- SUCCESS / PASS SCREEN (Initially Hidden) -->
  <div id="successScreen" class="hidden">
    <div class="success-icon">✓</div>
    <h2>Registration Successful!</h2>
    <p class="subtitle">Please show today's pass code to security or the front desk.</p>
    
    <div class="pass-box">
      <p style="margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #475569;">Today's Day Pass Code</p>
      <div class="pass-code" id="displayCode">LOADING...</div>
      <p style="margin: 0; font-size: 14px; font-weight: 600; color: #334155;" id="visitorSummaryName"></p>
    </div>

    <button type="button" class="btn-success" onclick="location.reload()">
      Done / New Entry
    </button>
  </div>

</div>

<script>
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbw7Jks7KZnlkTEBu0a7mdmHJS91Xjc5gPN5PjOwUVpIFOoF_esVGMhukWrkvMUVyVxQ/exec";

let cameraStream = null;
let selfieImage = null;
let currentDayCode = "";

/**
 * GET: Fetch active Day Code from Google Sheet
 */
async function fetchDayCode() {
  try {
    const response = await fetch(`${SCRIPT_URL}?action=dayCode`, {
      method: "GET",
      cache: "no-store"
    });
    const result = await response.json();
    if (result && result.ok && result.dayCode) {
      currentDayCode = String(result.dayCode).trim();
      return currentDayCode;
    }
  } catch (error) {
    console.error("Error fetching day code:", error);
  }
  return currentDayCode || "N/A";
}

/**
 * GET: Optional helper to fetch logged visitors from Google Sheet
 */
async function fetchVisitors() {
  const response = await fetch(`${SCRIPT_URL}?action=visitors`, {
    method: "GET",
    cache: "no-store"
  });
  const result = await response.json();
  if (!result.ok) {
    throw new Error(result.error || "Failed to fetch visitors");
  }
  return result.visitors;
}

/**
 * POST: Send visitor entry to Google Sheet and return server confirmation
 */
async function submitVisitorEntry(payload) {
  try {
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();
    if (!result.ok) {
      throw new Error(result.error || "Server rejected entry");
    }
    return result;
  } catch (err) {
    // Fallback for opaque CORS redirects if Apps Script deployment isn't returning CORS headers
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });
    return {
      ok: true,
      dayCode: currentDayCode || payload.dayCode || "N/A"
    };
  }
}

window.addEventListener("DOMContentLoaded", () => {
  fetchDayCode();
});

async function openCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("Camera is not supported in this browser.");
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "user" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    const video = document.getElementById("video");
    video.style.display = "block";
    video.srcObject = cameraStream;
    await video.play();

    document.getElementById("captureBtn").disabled = false;
    document.getElementById("openBtn").disabled = true;
    document.getElementById("photoStatus").innerText = "Camera ready. Tap Capture Selfie.";
  } catch (error) {
    alert("Camera error: " + error.message);
  }
}

function capturePhoto() {
  const video = document.getElementById("video");

  if (!cameraStream || !video.videoWidth) {
    alert("Please open camera first.");
    return;
  }

  const canvas = document.getElementById("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

  // 0.65 JPEG quality keeps payload size lighter for sheet storage
  selfieImage = canvas.toDataURL("image/jpeg", 0.65);

  document.getElementById("preview").src = selfieImage;
  document.getElementById("preview").style.display = "block";
  video.style.display = "none";

  if (cameraStream) {
    cameraStream.getTracks().forEach((track) => track.stop());
    cameraStream = null;
  }

  document.getElementById("openBtn").style.display = "none";
  document.getElementById("captureBtn").style.display = "none";
  document.getElementById("retakeBtn").style.display = "block";
  document.getElementById("photoStatus").innerText = "Selfie captured successfully!";
}

function retakePhoto() {
  selfieImage = null;

  document.getElementById("preview").style.display = "none";
  document.getElementById("video").style.display = "block";

  document.getElementById("openBtn").style.display = "block";
  document.getElementById("captureBtn").style.display = "block";
  document.getElementById("captureBtn").disabled = true;
  document.getElementById("retakeBtn").style.display = "none";
  document.getElementById("openBtn").disabled = false;

  document.getElementById("photoStatus").innerText = "Selfie not captured (Optional)";
  openCamera();
}

document.getElementById("visitorForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const mobileInput = document.getElementById("mobile").value.trim();
  const vehicleInput = document.getElementById("vehicle").value.trim().toUpperCase();

  const mobileRegex = /^[0-9]{10}$/;
  if (!mobileRegex.test(mobileInput)) {
    alert("Please enter a valid 10-digit mobile number.");
    document.getElementById("mobile").focus();
    return;
  }

  if (vehicleInput !== "") {
    const vehicleRegex = /^[A-Z]{2}[0-9]{1,2}[A-Z]{0,3}[0-9]{4}$/;
    const cleanedVehicle = vehicleInput.replace(/[- ]/g, "");
    if (!vehicleRegex.test(cleanedVehicle)) {
      alert("Please enter a valid vehicle number format (e.g., GJ01AB1234).");
      document.getElementById("vehicle").focus();
      return;
    }
  }

  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  btn.disabled = true;
  btn.innerText = "Submitting...";
  status.innerText = "Fetching day code & submitting entry...";

  try {
    const latestDayCode = await fetchDayCode();
    const visitorName = document.getElementById("name").value.trim();
    const deptInput = document.getElementById("department").value.trim();

    const payload = {
      dayCode: latestDayCode,
      name: visitorName,
      mobile: mobileInput,
      company: document.getElementById("company").value.trim(),
      person: document.getElementById("person").value.trim(),
      department: deptInput !== "" ? deptInput : "N/A",
      purpose: document.getElementById("purpose").value.trim(),
      vehicle: vehicleInput !== "" ? vehicleInput : "N/A",
      photo: selfieImage ? selfieImage : "No Photo"
    };

    const serverResult = await submitVisitorEntry(payload);
    const finalCodeToDisplay = serverResult.dayCode || latestDayCode;

    document.getElementById("formScreen").classList.add("hidden");
    document.getElementById("successScreen").classList.remove("hidden");
    document.getElementById("displayCode").innerText = finalCodeToDisplay;
    document.getElementById("visitorSummaryName").innerText = "Visitor: " + visitorName;
  } catch (error) {
    status.innerText = "Error: " + error.message;
    btn.disabled = false;
    btn.innerText = "Submit Visitor Entry";
  }
});
</script>

</body>
</html>
